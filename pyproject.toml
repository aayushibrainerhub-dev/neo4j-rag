[project]
name = "neo4j-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aayushibrainerhub-dev", email = "aayushi.brainerhub@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "langchain>=1.4.3",
    "langchain-huggingface>=1.2.2",
    "langchain-neo4j>=0.10.0",
    "neo4j>=6.4.0",
    "sentence-transformers>=6.1.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.27.0",
    "langchain-community>=0.4.2",
]

[project.scripts]
neo4j-demo = "neo4j_demo:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
